<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cute Video Page</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
    }

    body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg,#fff7fb,#ffe6f2);
    }

    .container{
    background:white;
    width:90%;
    max-width:850px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
    border:1px solid #ffd6e8;
    }

    h1{
    font-size:2rem;
    margin-bottom:10px;
    color:#ff7aa2;
    }

    p{
    color:#777;
    margin-bottom:25px;
    }

    .video-wrapper{
    position:relative;
    padding-bottom:56.25%; /* 16:9 ratio */
    height:0;
    }

    .video-wrapper iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
    }

    .footer{
    margin-top:18px;
    font-size:14px;
    color:#aaa;
    }
</style>
</head>

<body>
    <div class="container">

    <h1>🎀 My Demo</h1>
    <p>A soft pastel video page</p>

    <div class="video-wrapper">
       <iframe width="560" height="315" src="https://www.youtube.com/embed/mZgvIBq2yMw?si=-Av3N5t9lfiaJ7iR" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <div class="footer">
    made with pastel vibes ✨
    </div>
</div>

</body>
</html>
